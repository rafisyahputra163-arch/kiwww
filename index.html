<style>
:root{--bg:#fff5f7;--card:#ffffff;--ink:#4a2433;--muted:#9a6b7b;--accent:#e8557a;--soft:#ffd9e2;--shadow:rgba(232,85,122,.2);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1117;--card:#2a1a22;--ink:#ffe8ee;--muted:#c79aaa;--accent:#ff7d9f;--soft:#4a2433;--shadow:rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#1d1117;--card:#2a1a22;--ink:#ffe8ee;--muted:#c79aaa;--accent:#ff7d9f;--soft:#4a2433;--shadow:rgba(0,0,0,.45)}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;display:flex;align-items:center;justify-content:center;overflow-x:hidden}
.wrap{width:100%;max-width:440px;padding:20px;box-sizing:border-box}
.top{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:14px;margin-bottom:10px;min-height:20px}
.card{background:var(--card);border-radius:24px;padding:28px 22px;box-shadow:0 10px 30px var(--shadow);text-align:center;animation:in .4s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.emo{font-size:60px;line-height:1.1;margin-bottom:8px}
h1{font-size:24px;margin:0 0 10px}
p{font-size:17px;line-height:1.55;margin:0 0 18px;white-space:pre-line}
button,input{font-family:inherit;font-size:16px;border-radius:14px;box-sizing:border-box;width:100%}
button{border:0;background:var(--accent);color:#fff;padding:14px;margin-top:10px;cursor:pointer}
button.alt{background:var(--soft);color:var(--ink)}
button:active{transform:scale(.98)}
button:disabled{opacity:.4}
input{border:2px solid var(--soft);background:var(--bg);color:var(--ink);padding:12px;margin-bottom:10px;text-align:center}
.lst{max-height:38vh;overflow-y:auto;text-align:left;font-size:15px;line-height:1.5;margin-bottom:8px}
.lst div{background:var(--bg);border-radius:12px;padding:10px 12px;margin-bottom:8px;white-space:pre-line}
.fly{position:fixed;bottom:20%;font-size:24px;color:var(--accent);pointer-events:none;animation:up 1.4s ease-out forwards}
@keyframes up{to{transform:translateY(-220px);opacity:0}}
@media (prefers-reduced-motion:reduce){.fly,.card{animation:none}}
</style>
</head>

var SR=[
"Untuk Nina, seseorang yang begitu berarti buat aku. ❤️\n\nHai, Nina.\n\nAku sebenarnya bingung harus mulai dari mana, karena ada banyak hal yang ingin aku sampaikan, tetapi terkadang semuanya terasa sulit untuk dijelaskan lewat kata-kata. Jadi, lewat surat ini, aku ingin mencoba mengungkapkan sedikit dari apa yang selama ini aku rasakan.\n\nNina, aku bersyukur bisa mengenal kamu dan menjadikanmu bagian dari hidupku. Aku nggak pernah menyangka kalau seseorang bisa menjadi begitu berarti melalui hal-hal sederhana, seperti percakapan kecil, candaan, perhatian, dan waktu yang kita habiskan bersama.",
"Mungkin aku nggak selalu pandai menunjukkan perasaanku. Terkadang aku terlalu banyak berpikir, khawatir terhadap sesuatu yang belum tentu terjadi, atau melakukan kesalahan tanpa menyadarinya. Aku tahu aku masih punya banyak kekurangan, dan aku nggak akan berpura-pura menjadi seseorang yang sempurna di hadapanmu.\n\nTapi satu hal yang ingin kamu tahu, aku benar-benar menyayangimu, Nina. Bukan hanya karena hal-hal baik yang ada dalam dirimu, tetapi juga karena aku ingin mengenalmu lebih jauh, memahami dirimu, dan belajar menerima bahwa kita berdua punya kekurangan masing-masing.",
"Aku nggak ingin kamu merasa harus selalu menjadi seseorang yang sempurna ketika bersamaku. Kalau kamu lelah, kamu boleh beristirahat. Kalau kamu sedang banyak pikiran, kamu boleh bercerita atau mengambil waktu untuk dirimu sendiri. Kamu nggak harus selalu terlihat bahagia hanya supaya aku merasa baik-baik saja.\n\nAku ingin menjadi seseorang yang bisa mendengarkan ceritamu tanpa menghakimi, memahami perasaanmu tanpa memaksamu, dan menghargai dirimu tanpa meminta kamu menjadi orang lain.",
"Aku tahu hubungan nggak akan selalu berjalan mudah. Mungkin akan ada kesalahpahaman, perbedaan pendapat, atau hari-hari ketika kita sama-sama merasa lelah. Tapi aku berharap kita bisa belajar menghadapi semuanya dengan saling mendengarkan, bukan saling menyalahkan.\n\nAku pun masih belajar mengendalikan pikiranku, memahami perasaanmu, dan menjadi seseorang yang lebih baik. Aku ingin memperbaiki diri bukan karena aku harus menjadi sempurna untukmu, melainkan karena aku ingin menyayangimu dengan cara yang lebih dewasa dan tulus.\n\nMaaf kalau selama ini aku belum selalu bisa memahami kamu dengan baik. Maaf kalau terkadang caraku menyampaikan perasaan justru membuatmu bingung. Aku nggak bisa menjanjikan bahwa aku nggak akan pernah melakukan kesalahan lagi, tetapi aku ingin terus belajar dari setiap kesalahan yang aku buat.",
"Nina, mungkin sekarang aku belum bisa memberikan semua hal yang kamu inginkan. Ada banyak hal yang masih harus aku perjuangkan, dan ada keinginan yang belum bisa aku wujudkan. Tapi aku berharap kamu bisa melihat kesungguhanku melalui hal-hal sederhana yang aku usahakan.\n\nAku ingin membahagiakanmu dengan caraku sendiri, sesuai kemampuanku. Aku ingin membuatmu merasa dihargai, didengarkan, dan disayangi. Aku juga ingin mendukungmu untuk terus berkembang, mengejar impianmu, dan menjadi seseorang yang kamu banggakan.\n\nAku nggak ingin hubungan ini membuat kita kehilangan diri sendiri. Aku ingin kita bisa tumbuh bersama, saling mendukung, dan belajar memahami satu sama lain tanpa harus terburu-buru.",
"Terima kasih karena sudah hadir dalam hidupku, Nina. Terima kasih untuk setiap cerita, perhatian, waktu, dan hal-hal kecil yang mungkin nggak kamu sadari, tetapi berarti buat aku.\n\nAku menghargai kesempatan untuk mengenalmu lebih jauh. Aku menghargai setiap momen yang kita lalui, dan aku berharap masih ada banyak cerita indah yang bisa kita buat bersama.\n\nAku memang nggak tahu bagaimana perjalanan kita ke depannya. Aku nggak bisa menjanjikan bahwa semuanya akan selalu mudah. Tapi selama kita sama-sama ingin berusaha, aku ingin menjalani hubungan ini dengan sungguh-sungguh, tanpa harus berpura-pura sempurna.\n\nAku ingin menyayangimu bukan hanya ketika semuanya terasa menyenangkan, tetapi juga dengan tetap berusaha memahami kamu ketika keadaan sedang nggak mudah.",
"Aku ingin kita bisa saling jujur, saling menghargai, dan saling memberikan ruang untuk bertumbuh. Aku ingin kita merasa nyaman menjadi diri sendiri, tanpa harus takut bahwa setiap kekurangan akan membuat kita kehilangan satu sama lain.\n\nNina, kalau suatu hari kamu merasa kurang baik atau merasa belum menjadi seseorang yang kamu inginkan, jangan terlalu keras terhadap dirimu sendiri, ya. Kamu nggak harus sempurna untuk bisa dihargai dan disayangi. Kamu tetap punya banyak hal baik dalam dirimu, bahkan ketika kamu sendiri mungkin belum bisa melihatnya.\n\nAku berharap kamu selalu punya alasan untuk tersenyum, kekuatan untuk menghadapi hari-hari yang berat, dan keberanian untuk terus mengejar apa yang kamu impikan.\n\nDan kalau suatu hari aku melakukan kesalahan, aku berharap kita masih bisa membicarakannya baik-baik. Aku ingin kita terus belajar, bukan menuntut satu sama lain untuk selalu benar.",
"Pada akhirnya, aku cuma ingin kamu tahu bahwa kehadiranmu berarti buat aku. Aku mungkin nggak selalu bisa mengungkapkan semuanya dengan sempurna, tetapi perasaanku bukan sesuatu yang ingin aku main-mainkan.\n\nAku sayang kamu, Nina. Bukan karena kamu sempurna, melainkan karena aku ingin mengenalmu sebagai dirimu sendiri, menerima bahwa kita punya kekurangan, dan terus belajar menyayangimu dengan lebih baik.\n\nTerima kasih sudah menjadi bagian dari ceritaku. Terima kasih sudah menjadi dirimu sendiri, seseorang yang ingin aku kenal lebih jauh dan yang kebahagiaannya juga berarti buat aku.\n\nSemoga kita bisa terus berjalan pelan-pelan, menikmati setiap prosesnya, dan saling menjaga perasaan tanpa harus menjadi sempurna.\n\nJaga dirimu baik-baik, ya, Nina. Jangan lupa bahagia, jangan terlalu keras sama diri sendiri, dan jangan lupa bahwa kamu juga berhak mendapatkan hal-hal baik dalam hidupmu.\n\nDengan tulus, dari aku untuk kamu, Nina. ❤️"
];
function mkLetter(){return "Untuk {nama},\n"+LA[draw('a',LA.length)]+" "+LB[draw('b',LB.length)]+"\n\n"+LC[draw('c',LC.length)]+"\n{aku} ♥"}
function riddle(done){
  var q=RD[draw('r',RD.length)];
  R("🧩",q[0],shuf([q[1],q[2],q[3]]).map(function(a){return[a,function(b){
    if(a===q[1]){gain(2);out("Betul! Jawabannya “"+q[1]+"”. Kamu pintar sekali, dan {aku} bangga.",done)}
    else{b.disabled=true;b.textContent="Bukan itu, coba lagi 😘"}},0]}));
}
function ev(){
  
  var i=draw('e',EV.length,function(i){return !EV[i].ken||S.ken}),e=EV[i],l=LOK[draw('l',LOK.length)];S.lok=l[1];
  var t=e.ken?"{nama} teringat kenangan kalian: “"+S.ken+"”":"Di {lok}, "+e.t;
  R(l[0],t,e.c.map(function(o){return[o[0],function(){gain(o[2]);out(o[1],after)},undefined]}));
}
function step(){if(S.st%4===3)riddle(after);else ev()}
function after(){
  S.st++;save();
  if(Math.floor(S.h/5)>S.L){var j=S.L++,l,tt="Sebuah surat cinta baru muncul!";if(j<SR.length){l="Bagian "+(j+1)+" dari "+SR.length+"\n\n"+SR[j];tt=j===SR.length-1?"Bagian terakhir terbuka! Seluruh surat dari {aku} kini ada di koleksimu, dan petualangan terus berlanjut tanpa ujung.":"Surat dari {aku} untuk {nama}: bagian "+(j+1)+" terbuka!"}else l=mkLetter();S.ls.push(l);save();return R("💌",tt+"\n\n"+l,[["Simpan ke koleksi",after2,0]])}
  after2();
}
function after2(){
  if(S.st%5===0){var c=KP[draw('k',KP.length)];S.cp.push(c);save();return R("🎟️","Kamu menemukan kupon cinta:\n\n“"+c+"”\n\n{aku} berjanji menepatinya!",[["Simpan ke koleksi",hub,0]])}
  hub();
}
function hub(){
  S.pro=1;save();
  R(pick(["🌄","🛤️","🌙","🌈"]),HT[draw('h',HT.length)],[["Lanjut berjalan 🚶",step,0],["Koleksi kenangan 🎁",coll,1]]);
}
function coll(){
  var c=R("🎁","Koleksi · "+S.h+" hati · "+S.ls.length+" surat · "+S.cp.length+" kupon\nGelar: "+title(),[["Kembali berjalan",hub,0],["Mulai dari awal",function(b){
    if(b.dataset.s){S=JSON.parse(JSON.stringify({nama:"Sayang",aku:"Aku",ken:"",h:0,st:0,L:0,ls:[],cp:[],pro:0,rec:[],lok:""}));save();setup()}
    else{b.dataset.s=1;b.textContent="Yakin? Ketuk sekali lagi"}},1]]);
  var d=document.createElement("div");d.className="lst";
  S.cp.concat(S.ls).slice().reverse();
  S.cp.forEach(function(x){var i=document.createElement("div");i.textContent="🎟️ "+x;d.appendChild(i)});
  S.ls.forEach(function(x){var i=document.createElement("div");i.textContent="💌 "+sub(x);d.appendChild(i)});
  if(!d.children.length){var i=document.createElement("div");i.textContent="Belum ada koleksi. Terus berjalan, ya!";d.appendChild(i)}
  c.insertBefore(d,c.querySelector("button"));
}
var PR={
mulai:["🗺️","Pagi itu, {nama} menemukan peta kecil terselip di bawah bantal.\n\nDi pojoknya ada tulisan tangan: “Ikuti aku, ada kejutan di ujung jalan.”",[["Ikuti peta ke taman","taman"],["Sarapan dulu, baru jalan","kafe"]]],
taman:["🦋","Di taman, seekor kupu-kupu hinggap di bahu {nama}, lalu terbang pelan menuju rumpun mawar merah muda.",[["Petik satu mawar","jembatan"],["Duduk menikmati angin","jembatan"]]],
kafe:["☕","Di kafe kecil, barista menyodorkan cangkir dengan gambar hati di busanya.\n\nDi bawah cawan ada catatan: “Kamu alasan aku senyum hari ini.”",[["Simpan catatannya","jembatan"],["Baca keras-keras sambil senyum","jembatan"]]],
gerbang:["🚪","Kotak di jembatan terbuka, dan isinya… sebuah kunci emas berbentuk hati.\n\nDi balik jembatan, sebuah gerbang bercahaya terbuka. Di baliknya ada perjalanan tanpa ujung, penuh kejutan, surat, dan kupon cinta.",[["Melangkah masuk ♥","hub"]]]
};
function go(k){
  if(k==="hub")return hub();
  if(k==="jembatan"){return R("🌅","Senja turun di jembatan kayu. Sebuah kotak terkunci menunggu, dengan teka-teki di tutupnya.",[["Buka teka-tekinya",function(){riddle(function(){go("gerbang")})},0]])}
  var d=PR[k];R(d[0],d[1],d[2].map(function(o){return[o[0],function(){gain(1);go(o[1])},undefined]}));
}
function setup(){
  var c=$("card");
  c.innerHTML='<div class="emo">💕</div><h1>Petualangan Menuju Hatimu</h1><p>Petualangan kecil tanpa ujung, dibuat khusus untukmu.</p><input id="n1" placeholder="Nama si cantikk" maxlength="30"><input id="n2" placeholder="Nama si sigma yang kirim inii" maxlength="30"><button id="go">Mulai petualangan ♥</button>';
  $("go").onclick=function(){S.nama=$("n1").value.trim()||"Sayang";S.aku=$("n2").value.trim()||"Aku";save();go("mulai")};
  upd();
}
var sv=load();
if(sv&&sv.pro){S=sv;S.rec=S.rec||[];R("💞","Selamat datang kembali, {nama}! {aku} sudah menunggumu.\n\n♥ "+S.h+" · "+title(),[["Lanjutkan petualangan",hub,0],["Mulai baru",function(){S={nama:"Sayang",aku:"Aku",ken:"",h:0,st:0,L:0,ls:[],cp:[],pro:0,rec:[],lok:""};setup()},1]])}
else setup();
</script>
